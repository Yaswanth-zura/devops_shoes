name: SHOES Build And Push

on:

  push:
    branches:
      - main

  workflow_dispatch:

jobs:


  pre-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
            distribution: temurin
            java-version: '11'

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Build Application
        run: mvn clean package -DskipTests


  build-and-push:
        
    needs: pre-build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      - name: Login To Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Version
        run: docker --version

      - name: Build SHOES Image
        run: |
          docker build \
          -t 663566123253.dkr.ecr.ap-south-2.amazonaws.com/shoes:${{ github.run_number }} \
          .

      - name: Push SHOES Image
        run: |
          docker push \
          663566123253.dkr.ecr.ap-south-2.amazonaws.com/shoes:${{ github.run_number }}

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy SHOES To EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd ~/devops_shoes

            git pull origin main

            sed -i "s/^SHOES_TAG=.*/SHOES_TAG=${{ github.run_number }}/" .env

            echo "===== UPDATED ENV ====="
            cat .env

            aws ecr get-login-password \
            --region ap-south-2 \
            | docker login \
            --username AWS \
            --password-stdin \
            663566123253.dkr.ecr.ap-south-2.amazonaws.com

            docker network inspect micro-net >/dev/null 2>&1 || \
            docker network create micro-net

            docker compose pull shoes

            docker compose up -d shoes

            docker ps

  notify:

    if: always()

    needs:
      - pre-build
      - build-and-push
      - deploy

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Send SNS Notification

        run: |

          STATUS="${{ needs.deploy.result }}"
          BUILD_STATUS="${{ needs.pre-build.result }}"
          PUSH_STATUS="${{ needs.build-and-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          if [ "$BUILD_STATUS" != "success" ]; then
            FAILURE_POINT="Pre-Build"
          elif [ "$PUSH_STATUS" != "success" ]; then
            FAILURE_POINT="Build-And-Push"
          elif [ "$DEPLOY_STATUS" != "success" ]; then
            FAILURE_POINT="Deploy"
          else
            FAILURE_POINT="None"
          fi

          if [ "$BUILD_STATUS" = "success" ] && \
            [ "$PUSH_STATUS" = "success" ] && \
            [ "$DEPLOY_STATUS" = "success" ]; then

            OVERALL_STATUS="SUCCESS"

          else

            OVERALL_STATUS="FAILURE"

          fi

          aws sns publish \
          --region ap-south-2 \
          --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
          --subject "SHOES Deployment ${OVERALL_STATUS}" \
          --message "
          Repository      : devops_shoes

          Build Number    : ${{ github.run_number }}

          Overall Status  : ${OVERALL_STATUS}

          Pre-Build       : ${BUILD_STATUS}

          Build-And-Push  : ${PUSH_STATUS}

          Deploy          : ${DEPLOY_STATUS}

          Failure Point   : ${FAILURE_POINT}

          Commit          : ${{ github.sha }}

          Workflow        : ${{ github.workflow }}

          Repository URL  :
          https://github.com/${{ github.repository }}

          Run URL :
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "
